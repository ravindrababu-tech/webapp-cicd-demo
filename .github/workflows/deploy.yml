
name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Package application
        run: zip -r application.zip application.py requirements.txt Procfile

      - name: Upload application bundle to S3
        run: |
          aws s3 cp application.zip \
            s3://webapp-cicd-artifacts-909643315895/deployments/${GITHUB_SHA}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name sample-web-app \
            --version-label "github-${GITHUB_SHA}" \
            --source-bundle S3Bucket=webapp-cicd-artifacts-909643315895,S3Key=deployments/${GITHUB_SHA}.zip \
            --process

      - name: Deploy application
        run: |
          aws elasticbeanstalk update-environment \
            --application-name sample-web-app \
            --environment-name Sample-web-app-env \
            --version-label "github-${GITHUB_SHA}"
